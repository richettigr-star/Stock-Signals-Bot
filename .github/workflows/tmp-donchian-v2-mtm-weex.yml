name: Temporary Donchian v2 MTM WEEX Stress
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-mtm-weex.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run mark-to-market WEEX stress test
        run: |
          set -o pipefail
          python research/donchian_v2_mtm_weex_stress.py | tee mtm_weex_stress.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-mtm-weex-stress-20261028
          path: |
            donchian_v2_mtm_weex_stress.csv
            donchian_v2_mtm_templates.csv
            mtm_weex_stress.log
          retention-days: 7
