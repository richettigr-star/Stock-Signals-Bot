name: Temporary Donchian v2 Risk Finalist Stress
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-risk-finalist-stress.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run finalist stress tests
        run: |
          set -o pipefail
          python research/donchian_v2_risk_finalist_stress.py | tee finalist_stress.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-risk-finalist-stress-20261028
          path: |
            donchian_v2_finalist_stress.csv
            donchian_v2_priority_stress.csv
            finalist_stress.log
          retention-days: 7
