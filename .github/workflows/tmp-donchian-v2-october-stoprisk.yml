name: Temporary Donchian v2 October Stop Risk
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-october-stoprisk.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run October stop-risk forward check
        run: python research/donchian_v2_october_stoprisk.py | tee october_stoprisk.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-october-stoprisk-20261028
          path: |
            donchian_v2_october_stoprisk.csv
            october_stoprisk.log
          retention-days: 7
