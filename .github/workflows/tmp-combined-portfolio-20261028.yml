name: Temporary Combined Crypto Portfolio
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-combined-portfolio-20261028.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/combined-portfolio-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run exact three-strategy portfolio
        run: |
          set -o pipefail
          python research/combined_portfolio_3exact.py | tee combined_portfolio.log
      - uses: actions/upload-artifact@v4
        with:
          name: combined-portfolio-3exact-20261028
          path: |
            combined_portfolio_output/
            combined_portfolio.log
          retention-days: 7
