name: Temporary Donchian v2 Directional Caps Fast
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-directional-caps-fast.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run optimized directional grid
        run: python research/donchian_v2_directional_caps_fast.py | tee directional_caps_fast.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-directional-caps-fast-20261028
          path: |
            donchian_v2_directional_caps_fast.csv
            directional_caps_fast.log
          retention-days: 7
