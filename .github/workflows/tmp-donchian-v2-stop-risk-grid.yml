name: Temporary Donchian v2 Stop Risk Grid
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-stop-risk-grid.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run stop-risk sizing grid
        run: |
          set -o pipefail
          python research/donchian_v2_stop_risk_grid.py | tee stop_risk_grid.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-stop-risk-grid-20261028
          path: |
            donchian_v2_stop_risk_grid.csv
            donchian_v2_stop_risk_trades.csv
            stop_risk_grid.log
          retention-days: 7
