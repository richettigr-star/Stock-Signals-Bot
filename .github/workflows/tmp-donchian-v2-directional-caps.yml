name: Temporary Donchian v2 Directional Caps
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-directional-caps.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run directional concentration grid
        run: |
          set -o pipefail
          python research/donchian_v2_directional_caps.py | tee directional_caps.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-directional-caps-20261028
          path: |
            donchian_v2_directional_caps.csv
            directional_caps.log
          retention-days: 7
