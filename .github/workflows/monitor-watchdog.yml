name: Intraday Monitor Watchdog
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Intraday Exit Signals"]
    types: [requested]
    branches: [main]
  schedule:
    - cron: "29,49 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "3 10-16 * * 1-5"
      timezone: "America/New_York"
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-monitor-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -q
      - name: Configure checkpoint identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Supervise remote heartbeat each minute independently of monitor lock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python action_runtime.py watchdog
      - name: Preserve watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: watchdog_health.json
