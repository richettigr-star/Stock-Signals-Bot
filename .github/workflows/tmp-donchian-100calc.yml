name: Temporary Donchian $100 Calculation
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-100calc.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run exact Donchian research and print 2026 YTD
        run: |
          set -o pipefail
          python research/donchian_v2_repo_inspired_exact.py >/tmp/donchian.log
          python - <<'PY'
          import pandas as pd
          y=pd.read_csv('donchian_v2_repo_inspired_exact_output/yearly.csv')
          print(y[(y['year']==2026) & (y['variant'].isin(['BASE_V1','ATRBUF_025']))].to_string(index=False))
          PY
