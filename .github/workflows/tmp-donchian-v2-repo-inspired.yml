name: Temporary Donchian v2 Repo Inspired
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-repo-inspired.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run exact-pipeline preregistered Donchian v2 research
        run: |
          set -o pipefail
          python research/donchian_v2_repo_inspired_exact.py | tee donchian_v2_repo_inspired_exact.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donchian-v2-repo-inspired-exact-20261028
          path: |
            donchian_v2_repo_inspired_exact_output/
            donchian_v2_repo_inspired_exact.log
          retention-days: 7
