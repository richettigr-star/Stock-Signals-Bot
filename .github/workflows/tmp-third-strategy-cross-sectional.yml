name: Temporary Donchian 2020 Holdout
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-third-strategy-cross-sectional.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/third-strategy-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run exact Donchian candidate on 2020 holdout
        run: |
          set -o pipefail
          python research/third_strategy_donchian_2020_holdout.py | tee third_strategy_donchian_2020_holdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-strategy-donchian-2020-holdout
          path: |
            third_strategy_donchian_2020_holdout_output/
            third_strategy_donchian_2020_holdout.log
          retention-days: 7
