name: Temporary Donchian v2 October Forward
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-donchian-v2-october-forward.yml'
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/donchian-v2-repo-inspired-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run October forward check
        run: |
          set -o pipefail
          # Official Binance daily archive source; strategy parameters unchanged.
          python research/donchian_v2_october_forward.py | tee october_forward.log
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-v2-october-forward-20261028
          path: |
            donchian_v2_october_forward.csv
            october_forward.log
          retention-days: 7
