name: After-Close Stock Signals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scanner.py", "manage_state.py", "daily_runner.py", ".github/workflows/daily-signals.yml"]
  schedule:
    - cron: "20 20,21 * * 1-5"
    # Early-close support and retry windows; successful session scans are deduplicated.
    - cron: "37 17-23 * * 1-5"
permissions:
  contents: write
concurrency:
  group: stock-signal-state
  cancel-in-progress: false
  queue: max
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -q test_monitor.py
      - name: Process completed exchange session
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY_CAD: "100"
        run: python daily_runner.py
      - name: Rebuild dashboard
        if: always()
        run: python build_dashboard.py
      - name: Persist daily state and health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in signals.json report.md signal_state.json signal_events.json portfolio_state.json dashboard.md monitor_health.json daily_health.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update completed daily signals and dashboard"
            git pull --rebase
            git push
          fi
