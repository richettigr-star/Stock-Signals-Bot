name: Test Emergency Telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved_migration_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Encrypt approved stock credentials without sending Telegram messages
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/secret_envelope.py encrypt deploy/migration-public.pem stock-secrets.encrypted.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-secrets-encrypted
          retention-days: 1
          path: stock-secrets.encrypted.json
