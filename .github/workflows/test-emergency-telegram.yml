name: Test Emergency Telegram
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Approved migration phase (never sends test alerts)
        type: choice
        default: export
        options: [export, cutover]
permissions:
  contents: read
  actions: write
jobs:
  approved_migration_only:
    if: inputs.phase != 'cutover'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Encrypt approved stock credentials without sending Telegram messages
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/secret_envelope.py encrypt deploy/migration-public.pem stock-secrets.encrypted.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-secrets-encrypted
          retention-days: 1
          path: stock-secrets.encrypted.json
  stop_legacy_stock_writers:
    if: inputs.phase == 'cutover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable stock workflows and wait for all legacy writers to stop
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deploy/cutover_actions.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-cutover-evidence
          retention-days: 7
          path: stock-cutover.json
