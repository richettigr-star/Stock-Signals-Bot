name: Approved encrypted stock server migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/server-secret-export.yml"]
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt only existing stock secrets for the approved server
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deploy/secret_envelope.py encrypt deploy/migration-public.pem stock-secrets.encrypted.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-secrets-encrypted
          retention-days: 1
          path: stock-secrets.encrypted.json
