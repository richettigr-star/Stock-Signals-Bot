name: Temporary Third Strategy Funding Reversal
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-third-strategy-funding.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/third-strategy-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run blinded multi-pair funding-reversal research
        run: |
          set -o pipefail
          python research/third_strategy_funding_reversal.py | tee third_strategy_funding_reversal.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-strategy-funding-reversal-20261028
          path: |
            third_strategy_funding_reversal_output/
            third_strategy_funding_reversal.log
          retention-days: 7
