name: Intraday Exit Signals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "requirements.txt", ".github/workflows/intraday-exits.yml"]
  schedule:
    - cron: "3-58/5 13-22 * * 1-5"
permissions:
  contents: write
concurrency:
  group: stock-signal-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -q test_monitor.py
      - name: Monitor stops and deliver pending alerts
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_exit.py
      - name: Rebuild dashboard
        if: always()
        run: python build_dashboard.py
      - name: Persist state, delivery receipts and health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in signal_state.json signal_events.json portfolio_state.json dashboard.md monitor_health.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update stop monitor and dashboard"
            git pull --rebase
            git push
          fi
