name: Intraday Exit Signals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "requirements.txt", ".github/workflows/intraday-exits.yml"]
  schedule:
    - cron: "27,37,47,57 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 10-15 * * 1-5"
      timezone: "America/New_York"
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-signal-state
  cancel-in-progress: false
  queue: max
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -q
      - name: Configure checkpoint identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Poll every five minutes in this runner with checkpoint and handover
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python action_runtime.py monitor
      - name: Preserve evidence and unpushed outbox on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            monitor_health.json
            monitor_cadence.json
            signal_events.json
            signal_state.json
